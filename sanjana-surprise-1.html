<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#19122f">
  <title>A tiny surprise for Sanjana</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='48'%3E🐾%3C/text%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--ink:#fff;--muted:#d9cfee;--pink:#ff70b8;--violet:#8d6bff;--card:rgba(255,255,255,.105)}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}
    body{font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0,#643c91 0,transparent 38%),radial-gradient(circle at 90% 90%,#7e285f 0,transparent 38%),#171029;overflow:hidden}
    main{min-height:100svh;display:grid;place-items:center;padding:24px;position:relative}
    .spark{position:absolute;font-size:clamp(20px,4vw,34px);opacity:.55;animation:float 4s ease-in-out infinite}.s1{left:8%;top:12%}.s2{right:10%;top:16%;animation-delay:-1.2s}.s3{left:15%;bottom:13%;animation-delay:-2.1s}.s4{right:13%;bottom:10%;animation-delay:-.7s}
    .card{width:min(100%,440px);padding:34px 28px 30px;text-align:center;border:1px solid rgba(255,255,255,.2);border-radius:30px;background:var(--card);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.38)}
    .gift{font-size:68px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.22));animation:bob 2.4s ease-in-out infinite}
    h1{margin:14px 0 8px;font-size:clamp(28px,8vw,40px);line-height:1.05;letter-spacing:-.04em}
    p{margin:0 auto 24px;color:var(--muted);font-size:17px;line-height:1.5}
    button{width:100%;min-height:58px;border:0;border-radius:18px;color:#231130;background:linear-gradient(135deg,#fff 0,#ffd8ec 100%);font:800 17px/1 system-ui;box-shadow:0 10px 28px rgba(255,112,184,.3);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
    button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #fff;outline-offset:4px}
    #reveal{display:none}.revealed #intro{display:none}.revealed #reveal{display:block;animation:pop .55s cubic-bezier(.2,.9,.25,1.25)}
    .boop{font-size:70px;margin-bottom:8px}.message{font-size:clamp(26px,7vw,36px);font-weight:900;line-height:1.17;letter-spacing:-.035em}.message strong{color:#ff9dcc}.from{margin-top:22px;color:var(--muted);font-size:15px}.again{margin-top:24px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28);box-shadow:none}
    .confetti{position:fixed;inset:-10vh 0 0;pointer-events:none}.piece{position:absolute;top:-10%;width:10px;height:16px;border-radius:3px;animation:fall 2.8s linear forwards}
    @keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}@keyframes float{50%{transform:translateY(-12px) rotate(8deg)}}@keyframes pop{0%{opacity:0;transform:scale(.72)}100%{opacity:1;transform:scale(1)}}@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(720deg)}}
    @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main id="app">
    <span class="spark s1">✨</span><span class="spark s2">🐾</span><span class="spark s3">💜</span><span class="spark s4">✨</span>
    <section class="card" aria-live="polite">
      <div id="intro">
        <div class="gift" aria-hidden="true">🎁</div>
        <h1>Hey Sanjana…</h1>
        <p>Ryan left you a very important best-friend message. Tap when you’re ready 😂</p>
        <button id="open" type="button">Open the surprise</button>
      </div>
      <div id="reveal">
        <div class="boop" aria-hidden="true">🐶💥</div>
        <div class="message">Sanjana, be a nice best friend and send <strong>BOOPS</strong> to Ryan 🐶😂</div>
        <div class="from">An extremely serious message from your best friend.</div>
        <button class="again" id="again" type="button">Replay surprise</button>
      </div>
    </section>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
  </main>
  <script>
    const app=document.querySelector('#app'),box=document.querySelector('#confetti');
    function party(){box.replaceChildren();const colors=['#ff70b8','#ffd166','#8d6bff','#61e7d2','#fff'];for(let i=0;i<54;i++){const p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];p.style.setProperty('--drift',(Math.random()*220-110)+'px');p.style.animationDelay=Math.random()*.45+'s';p.style.animationDuration=(2+Math.random()*1.7)+'s';box.appendChild(p)}}
    document.querySelector('#open').addEventListener('click',()=>{app.classList.add('revealed');party();if(navigator.vibrate)navigator.vibrate([60,40,90])});
    document.querySelector('#again').addEventListener('click',()=>{app.classList.remove('revealed');box.replaceChildren()});
  </script>
</body>
</html>
